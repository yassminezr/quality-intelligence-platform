name: QIP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quality_intelligence
          POSTGRES_USER: qip_user
          POSTGRES_PASSWORD: qip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qip_user -d quality_intelligence"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest -v