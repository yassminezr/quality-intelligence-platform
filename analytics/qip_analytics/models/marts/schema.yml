version: 2

models:

  - name: mart_audit_overview
    description: >
      Vue synthétique au niveau audit / compte / campagne.
      Sert principalement à la page de synthèse Power BI
      et aux KPI globaux.

    columns:

      - name: audit_id
        description: Identifiant technique unique de l'audit.
        tests:
          - not_null
          - unique

      - name: account_id
        description: Identifiant technique du compte.
        tests:
          - not_null

      - name: account_name
        description: Nom du compte audité.
        tests:
          - not_null

      - name: campaign_id
        description: Identifiant de la campagne d'audit.
        tests:
          - not_null

      - name: campaign_name
        description: Nom de la campagne, par exemple FY27.

      - name: completion_rate
        description: >
          Taux de complétude calculé à partir des
          contrôles applicables au compte.
        tests:
          - not_null

      - name: current_proposed_status
        description: >
          Statut proposé automatiquement par la plateforme.

      - name: official_audit_status
        description: >
          Statut officiellement validé par l'équipe Qualité.
          Peut être NULL tant qu'aucune validation n'a été fournie.

      - name: avg_maturity_score
        description: >
          Score moyen de maturité calculé uniquement
          sur les évaluations disposant d'un score.

      - name: account_badge
        description: >
          Catégorie de maturité du compte dérivée
          du score moyen.

      - name: total_findings_kpi
        description: >
          Nombre de findings comptabilisés dans le KPI,
          hors Bonne Pratique et NA.

      - name: open_action_count
        description: Nombre d'actions correctives non clôturées.

      - name: escalated_action_count
        description: >
          Nombre d'actions classées Escalade management.


  - name: mart_account_clause_detail
    description: >
      Vue détaillée de chaque compte par clause ISO.
      Une ligne correspond à un audit, un compte
      et un contrôle ISO. Les clauses non évaluées
      sont conservées avec des résultats NULL.

    columns:

      - name: audit_id
        tests:
          - not_null

      - name: account_id
        tests:
          - not_null

      - name: account_name
        description: Compte auquel appartient la ligne.
        tests:
          - not_null

      - name: control_id
        tests:
          - not_null

      - name: clause_iso
        description: Référence officielle de la clause ISO.
        tests:
          - not_null

      - name: evaluation_started
        description: >
          TRUE lorsqu'une évaluation existe dans le Core.

      - name: clause_scored
        description: >
          TRUE lorsqu'un score de maturité est renseigné.

      - name: categorie_finding
        description: >
          Catégorie du finding lorsqu'elle est disponible.

      - name: age_jours
        description: >
          Ancienneté calculée de l'action corrective.

      - name: indicateur_age
        description: >
          Normal, Alerte, Critique ou Escalade management.


  - name: mart_findings
    description: >
      Mart dédié à l'analyse des findings par compte,
      campagne et clause ISO.

    columns:

      - name: finding_id
        tests:
          - not_null
          - unique

      - name: account_name
        tests:
          - not_null

      - name: categorie_finding
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "NC Mineure"
                  - "NC Majeure"
                  - "Bonne Pratique"
                  - "OFI"
                  - "Observation"
                  - "NA"

      - name: is_counted_in_total_findings
        description: >
          TRUE si le finding doit être inclus
          dans le KPI Total Findings.


  - name: mart_corrective_actions
    description: >
      Mart de suivi des actions correctives et de leur ancienneté.

    columns:

      - name: action_id
        tests:
          - not_null
          - unique

      - name: account_name
        tests:
          - not_null

      - name: finding_id
        tests:
          - not_null

      - name: age_jours
        description: >
          Nombre de jours depuis le début de l'action,
          figé à la date de clôture lorsqu'elle est clôturée.

      - name: indicateur_age
        description: >
          Classe SLA de l'action corrective.

      - name: requires_attention
        description: >
          TRUE pour les actions critiques ou en escalade.


  - name: mart_maturity_distribution
    description: >
      Distribution des évaluations par niveau
      et score de maturité.

    columns:

      - name: account_id
        tests:
          - not_null

      - name: score_maturite
        tests:
          - not_null


  - name: mart_monitoring_runs
    description: >
      Historique analytique des exécutions du moteur
      de monitoring des actions correctives.
      Une ligne correspond à une exécution du monitoring.

    columns:

      - name: run_id
        description: Identifiant technique unique du run.
        tests:
          - not_null
          - unique

      - name: started_at
        description: Date et heure de démarrage du run.
        tests:
          - not_null

      - name: status
        description: Statut technique de l'exécution.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "running"
                  - "success"
                  - "failed"

      - name: actions_evaluated
        description: Nombre d'actions évaluées pendant le run.
        tests:
          - not_null

      - name: events_detected
        description: Nombre de changements de niveau détectés.
        tests:
          - not_null

      - name: messages_prepared
        description: Nombre de messages d'alerte préparés.
        tests:
          - not_null

      - name: emails_sent
        description: Nombre d'emails envoyés avec succès.
        tests:
          - not_null

      - name: emails_failed
        description: Nombre de tentatives d'envoi en échec.
        tests:
          - not_null

      - name: duration_seconds
        description: >
          Durée technique de l'exécution en secondes.
          Peut être NULL tant qu'un run n'est pas terminé.


  - name: mart_action_monitoring_history
    description: >
      Historique analytique des changements de niveau
      détectés pour les actions correctives.
      Une ligne correspond à un changement de niveau
      enregistré par le moteur de monitoring.

    columns:

      - name: monitoring_log_id
        description: Identifiant technique unique de l'événement.
        tests:
          - not_null
          - unique

      - name: action_id
        description: Identifiant de l'action corrective concernée.
        tests:
          - not_null

      - name: age_jours
        description: >
          Âge de l'action au moment où le changement
          de niveau a été détecté.

      - name: niveau_escalade
        description: >
          Niveau calculé par le moteur déterministe.
        tests:
          - accepted_values:
              arguments:
                values:
                  - "normal"
                  - "alerte"
                  - "critique"
                  - "escalade_management"

      - name: monitored_at
        description: Date et heure de détection du changement.
        tests:
          - not_null