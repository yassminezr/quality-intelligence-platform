qip_analytics:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'qip_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'qip_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'quality_intelligence') }}"
      schema: analytics
      threads: 4