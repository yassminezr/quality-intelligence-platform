services:

  postgres:
    image: postgres:16
    container_name: qip-postgres

    environment:
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U qip_user -d quality_intelligence"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: qip-airflow:2.10.5

    container_name: qip-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow-data:/opt/airflow

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "


  airflow-webserver:
    image: qip-airflow:2.10.5

    container_name: qip-airflow-webserver

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow-data:/opt/airflow

    ports:
      - "8080:8080"

    command: webserver

    restart: unless-stopped


  airflow-scheduler:
    image: qip-airflow:2.10.5

    container_name: qip-airflow-scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow-data:/opt/airflow

    command: scheduler

    restart: unless-stopped


  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: qip_streamlit

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: quality_intelligence
      POSTGRES_USER: qip_user
      POSTGRES_PASSWORD: qip_password

    ports:
      - "8501:8501"

    restart: unless-stopped


volumes:
  airflow-data:
  postgres-data: